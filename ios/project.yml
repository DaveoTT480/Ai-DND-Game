# Fallback project spec for XcodeGen (https://github.com/yonaskolb/XcodeGen).
# The checked-in OldTavern.xcodeproj already works with Xcode 16+; run
# `xcodegen generate` in this folder only if you need to regenerate it.
name: OldTavern
options:
  bundleIdPrefix: com.oldtavern
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
targets:
  OldTavern:
    type: application
    platform: iOS
    sources:
      - path: OldTavern
      - path: Config/Info.plist
        buildPhase: none
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.oldtavern.OldTavern
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
